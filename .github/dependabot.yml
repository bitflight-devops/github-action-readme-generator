version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - Jamie-BitFlight
    labels:
      - "github-actions"
      - "dependencies"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - Jamie-BitFlight
    labels:
      - "docker"
      - "dependencies"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - Jamie-BitFlight
    labels:
      - "npm"
      - "dependencies"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # The release preset (package.json `release.preset`). Keep it on a major
      # that the conventional-changelog-writer inside
      # @semantic-release/release-notes-generator renders. Move the major by
      # hand, after generateNotes renders a release with the new preset.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]
