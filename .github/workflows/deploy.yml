name: NPM Release Workflow

on:
  workflow_call:
    inputs:
      ref:
        description: 'The branch or tag ref to checkout. Defaults to the default branch.'
        required: false
        default: ${{ github.ref }}
        type: string
      sha:
        description: 'The commit SHA to checkout. Defaults to the SHA of the ref.'
        required: false
        default: ${{ github.sha }}
        type: string
      repository:
        description: 'The repository to checkout. Defaults to the current repository.'
        required: false
        default: ${{ github.repository }}
        type: string
      token:
        description: 'The token to use for authentication. Defaults to the token of the current workflow run.'
        required: false
        default: ${{ github.token }}
        type: string
    secrets:
      RELEASE_TOKEN:
        required: true
  repository_dispatch:
    types: [semantic-release]

concurrency:
  group: ci-${{ inputs.sha }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write # to be able to publish a GitHub release
  issues: write # to be able to comment on released issues
  pull-requests: write # to be able to comment on released pull requests
  id-token: write # to enable use of OIDC for npm provenance

jobs:
  deploy:
    name: Deploy NPM build
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      SKIP_PREFLIGHT_CHECK: true
      RELEASE_NODE_VERSION: '26.13.1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install minimum supported Node for package smoke
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Retain minimum Node for package smoke
        run: echo "RELEASE_COMPAT_NODE=$(command -v node)" >> "$GITHUB_ENV"

      - name: Install Node for build and publication
        uses: ./.github/actions/setup-node
        with:
          version: ${{ env.RELEASE_NODE_VERSION }}

      - name: Configure PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"
          echo "HOME=$HOME" >> "${GITHUB_ENV}"

      - name: Configure Git
        run: |
          git config --global user.email "${{ github.event.pusher.email || 'stack@bitflight.io' }}"
          git config --global user.name "${{ github.event.pusher.name || 'GitHub[bot]' }}"
          git fetch --tags
          git status --porcelain -u

      - name: Install Deps
        id: deps
        run: |
          npm ci

      - name: Ensure dependencies are compatible with the version of node
        run: npx --yes ls-engines

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-manager: false
          # npm ci already installed deps above; vp install's default
          # (run-install: true) writes a devEngines.packageManager pin into
          # package.json that then breaks every later plain `npm run ...`
          # step against the runner's actual npm version.
          run-install: false

      - name: Build with the publisher runtime
        run: |
          test "$(node --version)" = "v$RELEASE_NODE_VERSION"
          npm run build --if-present

      - run: |
          git add -f dist
          npm run generate-docs
          git commit -n -m 'build(release): bundle distribution files'

      - run: npm run semantic-release
