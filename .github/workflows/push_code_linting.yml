name: Code Linting Annotation
on:
  pull_request:
    branches:
      - main
      - next
      - beta
      - "*.x"
  push:
    branches:
      - main
      - next
      - beta
      - "*.x"

concurrency:
  group: ci-linting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  oxlint_annotation:
    name: runner / oxlint
    if: (!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
      statuses: write
      checks: write
    env:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install compatible Nodejs version
        id: setup-node
        uses: ./.github/actions/setup-node

      - name: Install Deps
        run: npm install

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-manager: false
          # npm install already installed deps above; vp install's default
          # (run-install: true) writes a devEngines.packageManager pin into
          # package.json that then breaks every later plain `npm run ...`
          # step (e.g. `npm run lint:markdown` below) against the runner's
          # actual npm version.
          run-install: false

      - name: Run Oxlint
        run: vp lint --format github --type-aware --type-check ./src/ ./__tests__/

      - uses: xt0rted/markdownlint-problem-matcher@v3.0.0
      - run: npm run lint:markdown
        continue-on-error: true
