name: Code Linting Annotation
on:
  pull_request:
    branches:
      - main
      - next
      - beta
      - "*.x"
  push:
    branches:
      - main
      - next
      - beta
      - "*.x"

concurrency:
  group: ci-linting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  biome_annotation:
    name: runner / biome
    if: (!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
      statuses: write
      checks: write
    env:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome lint
        run: biome lint ./src/ ./__tests__/

      - name: Install compatible Nodejs version
        id: setup-node
        uses: ./.github/actions/setup-node

      - name: Install Deps
        run: npm install

      - uses: xt0rted/markdownlint-problem-matcher@v3.0.0
      - run: npm run lint:markdown
        continue-on-error: true

      - name: Biome reviewdog
        uses: mongolyy/reviewdog-action-biome@v2
        with:
          reporter: github-pr-review
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_level: error
