name: Tag and Release Updated NPM Package

on:
  pull_request_target:
  push:
    branches:
      - main
      - next
      - beta
      - "*.x"
  repository_dispatch:
    types: [semantic-release]

concurrency:
  group: ci-${{ github.event.pull_request.number }}${{ github.ref }}${{ github.workflow }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write
  statuses: write
  checks: write
  actions: write
  id-token: write
  contents: write

jobs:
  node-version-matrix:
    name: Resolve Node version matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
      - id: set-matrix
        run: |
          pinned="$(cat .node-version)"
          echo "matrix=[\"${pinned}\", \"26.x\"]" >> "$GITHUB_OUTPUT"

  run-tests:
    needs: node-version-matrix
    name: Run unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.node-version-matrix.outputs.matrix) }}
    env:
      SKIP_PREFLIGHT_CHECK: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Install compatible Nodejs version
        id: setup-node
        uses: ./.github/actions/setup-node
        with:
          version: ${{ matrix.node-version }}

      - name: Configure PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "${GITHUB_PATH}"
          echo "HOME=$HOME" >> "${GITHUB_ENV}"

      - run: npm install

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-manager: false
          # npm install already installed deps above; vp install's default
          # (run-install: true) writes a devEngines.packageManager pin into
          # package.json that then breaks every later plain `npm run ...`
          # step (test/coverage/build/generate-docs below) against the
          # runner's actual npm version.
          run-install: false

      - name: vp check
        run: vp check ./src/ ./__tests__/

      - run: npm run test
      - run: npm run coverage
      - name: "Report Coverage"
        if: always()
        continue-on-error: true
        uses: davelosert/vitest-coverage-report-action@v2.12.2
        with:
          json-summary-path: "./out/coverage-summary.json"
          json-final-path: ./out/coverage-final.json
      - run: npm run build
      - run: npm run generate-docs
  call-workflow-passing-data:
    needs: run-tests
    if: ${{ github.event_name == 'push' }}
    permissions:
      issues: write
      pull-requests: write
      statuses: write
      checks: write
      actions: write
      id-token: write
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.head_ref || github.ref }}
    secrets: inherit
